name: Newsletter test send

# Test-mode trigger for the newsletter route. Vercel's Hobby plan only allows
# one cron run per day, so this calls the route on a schedule from GitHub
# instead. Scheduled workflows run from the default branch only. The real
# monthly send should move to a vercel.json cron (see CLAUDE.md).
on:
  schedule:
    # Hourly at :17. GitHub's minimum is every 5 minutes, and runs can be late.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the newsletter route
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/newsletter"
